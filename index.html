<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Market Trends Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container header-row">
      <h1>Crypto Market Trends</h1>
      <input type="text" id="searchInput" placeholder="Filter by name or symbol…" />
    </div>
  </header>

  <main class="container">
    <section class="chart-panel">
      <div class="chart-header">
        <h2 id="chartTitle">Select a coin to view its 7-day trend</h2>
        <span id="chartMeta"></span>
      </div>
      <canvas id="priceChart" height="90"></canvas>
    </section>

    <section>
      <div id="status" class="status">Loading market data…</div>
      <table id="coinTable" class="coin-table" hidden>
        <thead>
          <tr>
            <th>#</th>
            <th>Coin</th>
            <th>Price</th>
            <th>24h</th>
            <th>Market Cap</th>
          </tr>
        </thead>
        <tbody id="coinBody"></tbody>
      </table>
    </section>
  </main>

  <footer>
    <div class="container">Market data via CoinGecko public API</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
  <script src="script.js"></script>
</body>
</html>
