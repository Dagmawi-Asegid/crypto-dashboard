<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Market Trends Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="topnav">
    <div class="container topnav-row">
      <div class="brand">📊 Market Dashboard</div>
      <div class="nav-links">
        <a href="index.html" class="nav-link active">Crypto</a>
        <a href="stocks.html" class="nav-link">Stocks</a>
        <a href="funds.html" class="nav-link">Index Funds</a>
      </div>
    </div>
  </nav>

  <header>
    <div class="container header-row">
      <h1>Crypto Market Trends</h1>
      <div class="header-controls">
        <input type="text" id="searchInput" placeholder="Filter by name or symbol…" />
        <span id="lastUpdated" class="last-updated"></span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="chart-panel">
      <div class="chart-header">
        <h2 id="chartTitle">Select a coin to view its 7-day trend</h2>
        <span id="chartMeta"></span>
      </div>
      <canvas id="priceChart" height="90"></canvas>
    </section>

    <section>
      <div id="status" class="status">Loading market data…</div>
      <table id="coinTable" class="data-table" hidden>
        <thead>
          <tr>
            <th>#</th>
            <th>Coin</th>
            <th class="sortable" data-sort="current_price">Price</th>
            <th class="sortable" data-sort="price_change_percentage_24h">24h</th>
            <th class="sortable" data-sort="market_cap">Market Cap</th>
          </tr>
        </thead>
        <tbody id="coinBody"></tbody>
      </table>
    </section>
  </main>

  <footer>
    <div class="container">Market data via CoinGecko public API · Educational tool, not financial advice</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
  <script src="script.js"></script>
</body>
</html>
